x-app-environment: &app-environment
  DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
  SQS_ENDPOINT: http://sqs:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 2s
      retries: 20

  sqs:
    image: ministackorg/ministack
    ports: ["4566:4566"]

  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment: *app-environment
    ports: ["3000-3002:3000"]
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      sqs:
        condition: service_started
